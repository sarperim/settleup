name: CI

on:
  push:
    # NOTE (TKT-foundation-007, review round 1 / C-1, user decision
    # 2026-09-26): this repo's trunk is `master` — no `main` branch exists
    # or will exist. 04-ci-pipeline.md §4 assumes `main`; the push trigger
    # here and the artifact gate below are retargeted to `master`.
    # Deviation from §4 verbatim; doc amendment routed to the architect.
    branches: [master]
  pull_request:

# Least-privilege GITHUB_TOKEN (TKT-foundation-007, review round 1 / S-3):
# nothing in this workflow needs more than read access to the repository
# contents. Not present in 04-ci-pipeline.md §4; deviation documented in
# the ticket.
permissions:
  contents: read

# A new push to the same PR cancels the now-outdated run (saves minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Step 3+ needs a real database: PostgreSQL as a service container.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: settleup
          POSTGRES_PASSWORD: settleup
          POSTGRES_DB: settleup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settleup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://settleup:settleup@localhost:5432/settleup_test
      E2E_DATABASE_URL: postgresql://settleup:settleup@localhost:5432/settleup_e2e

    steps:
      # ── Step 1: Set up ────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # NOTE (TKT-foundation-007, first live CI run): pnpm/action-setup@v4
        # errors if an explicit `version:` is given here AND root
        # package.json declares `packageManager` (f-001 baseline pins
        # pnpm@10.34.5) — "Multiple versions of pnpm specified". The
        # package.json pin is the single source of truth, so no `version:`
        # input is passed. Deviation from 04-ci-pipeline.md §4 verbatim;
        # recommended amendment for the architecture doc.

      - name: Install Node 24 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      # ── Step 2: Quality gates ─────────────────────────────────────
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # ── Step 3: Test (unit + integration on real Postgres) ────────
      - name: Apply migrations to test database
        run: pnpm --filter api exec prisma migrate deploy

      - name: Unit & integration tests
        run: pnpm test

      # ── Step 4: Build & E2E smoke ─────────────────────────────────
      - name: Build
        run: pnpm build

      - name: Create E2E database & apply migrations
        # NOTE (TKT-foundation-007, review round 1 / C-2): psql cannot
        # connect TO the database it is creating — §4's step points
        # DATABASE_URL at settleup_e2e and then CREATEs settleup_e2e,
        # which deterministically fails ("database does not exist").
        # The CREATE now connects to the always-present maintenance DB
        # (`postgres`); the migrate below still targets settleup_e2e via
        # this step's env. Deviation from 04-ci-pipeline.md §4 verbatim
        # (the doc carries the same bug); doc amendment routed to the
        # architect.
        run: |
          psql "postgresql://settleup:settleup@localhost:5432/postgres" -c "CREATE DATABASE settleup_e2e;"
          pnpm --filter api exec prisma migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://settleup:settleup@localhost:5432/settleup_e2e

      - name: E2E smoke tests (Playwright)
        run: pnpm test:e2e

      - name: Upload build artifact
        # Trunk is `master` — see the push-trigger note above (C-1).
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            apps/api/dist
            apps/web/dist
          retention-days: 7
